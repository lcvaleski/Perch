name: PerchIOS
options:
  bundleIdPrefix: com.perch
  deploymentTarget:
    iOS: 17.0
  createIntermediateGroups: true
packages:
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios
    from: 5.0.0
targets:
  PerchIOS:
    type: application
    platform: iOS
    dependencies:
      - package: LinkKit
    sources:
      - path: PerchIOS
        excludes:
          - "**/*.xcassets"
          - "**/Info.plist"
          - "**/Preview Content"
          - "**/Package.swift"
          - "**/Sources"
          - "**/.gitignore"
          - "**/*.entitlements"
      - path: PerchIOS/Assets.xcassets
        type: folder
        buildPhase: resources
      - path: "PerchIOS/Preview Content"
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perch.PerchIOS
        INFOPLIST_FILE: PerchIOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: PerchIOS/PerchIOS.entitlements
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 1,2
        DEVELOPMENT_ASSET_PATHS: '"PerchIOS/Preview Content"'
        ENABLE_PREVIEWS: YES
    entitlements:
      path: PerchIOS/PerchIOS.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default